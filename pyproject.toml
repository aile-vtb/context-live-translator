[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-live-translator"
version = "0.3.2"
description = "Local Windows live transcription and context-aware translation desktop app"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Context Live Translator contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6>=6.7,<7",
  "sounddevice>=0.5,<1",
  "SoundCard>=0.4,<1",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "webrtcvad-wheels>=2.0.14,<3",
  "faster-whisper>=1.1,<2",
  "httpx>=0.27,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "huggingface-hub>=1.0,<2",
  "tqdm>=4.66,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
context-live-translator = "context_live_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_live_translator = ["static/*.html", "static/*.gif"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
